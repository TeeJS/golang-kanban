version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kanban
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
  kanban:
    build:
      dockerfile: Dockerfile
    ports:
      - "17808:17808"
    depends_on:
      - postgres
    environment:
      # Database connection — should match the postgres service above
      DB_USER: user
      DB_PASS: password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: kanban
      # Application
      SERVER_PORT: 17808
      # Auth — change these before deploying
      ADMIN_USER: admin
      ADMIN_PASS: changeme
      SESSION_SECRET: change-this-to-a-long-random-string
  kanban-mcp:
    build:
      dockerfile: Dockerfile.mcp
    ports:
      - "17809:17809"
    depends_on:
      - kanban
    environment:
      # Where the MCP server reaches the kanban app (service name on the compose network)
      KANBAN_URL: http://kanban:17808
      # X-API-Key from the kanban settings panel — set before starting
      KANBAN_API_KEY: paste-your-api-key-here
      # Bearer token MCP clients (Claude Code / Desktop) must present — change this
      MCP_AUTH_TOKEN: change-this-to-a-long-random-token
      MCP_PORT: 17809
volumes:
  postgres_data:
