name: lint

on:
  push:
  pull_request:

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Resolve module dependencies
        run: go mod tidy
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
